#textdomain wesnoth-samguk
[multiplayer]
    id=samguk_2p_hangang
    name= _ "2p — 한강 유역"
    description= _ "한강이 땅을 남북으로 가른다. 여울 세 곳과 돌다리 두 곳을 먼저 차지하는 쪽이 강을 건넌다. 깊은 물웅덩이는 수군의 차지다."
    map_file=samguk/multiplayer/maps/2p_Hangang.map
    random_start_time=no

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        [ai]
            villages_per_scout=8
        [/ai]
        side=1
        canrecruit=yes
        controller=human
        team_name=north
        user_team_name= _ "북"
        fog=yes
    [/side]
    [side]
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
        team_name=south
        user_team_name= _ "남"
        fog=yes
    [/side]
[/multiplayer]
