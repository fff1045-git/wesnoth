#textdomain wesnoth-samguk
# 맵은 기본 대전 맵 2p_Hamlets(Doc Paterson 작)를 그대로 쓴다.
[multiplayer]
    id=samguk_2p_gwanmiseong
    name= _ "2p — 관미성 공방"
    description= _ "백제의 요새 관미성과 주변 마을들을 두고 벌이는 공방전. 맵은 Doc Paterson이 만든 Hamlets를 그대로 썼다."
    map_file=multiplayer/maps/2p_Hamlets.map
    random_start_time=no

    {DEFAULT_SCHEDULE}
    {DEFAULT_MUSIC_PLAYLIST}

    [side]
        [ai]
            villages_per_scout=8
        [/ai]
        side=1
        canrecruit=yes
        controller=human
        team_name=north
        user_team_name= _ "북"
        fog=yes
    [/side]
    [side]
        [ai]
            villages_per_scout=8
        [/ai]
        side=2
        canrecruit=yes
        controller=human
        team_name=south
        user_team_name= _ "남"
        fog=yes
        [village]
            x=22
            y=27
        [/village]
    [/side]
[/multiplayer]
