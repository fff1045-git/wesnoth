#textdomain wesnoth-samguk
# 「삼국: 한강의 패권」 코어의 루트 파일 (data/cores.cfg의 path="samguk").
# data/_main.cfg와 data/core/_main.cfg를 따르되, 기본 유닛·세력·캠페인 대신
# data/samguk 아래의 콘텐츠를 읽는다.

# data/core/units.cfg에서 기본 유닛 타입을 빼고 이동 타입·특성·종족만 가져온다.
#define SAMGUK_CORE
#enddef

#ifdef TITLE_SCREEN
#define NO_TERRAIN_GFX
#enddef
#endif

#ifdef NO_GUI
#define NO_TERRAIN_GFX
#enddef
#endif

{english.cfg}

{themes/}

[lua]
    code=<<
wesnoth.dofile 'lua/wml-tags.lua'
wesnoth.dofile 'lua/feeding.lua'
wesnoth.dofile 'lua/diversion.lua'
wesnoth.dofile 'lua/stun.lua'
>>
[/lua]

#ifndef NO_TERRAIN_GFX
{core/terrain-graphics/}
#endif

{core/macros/}

[credits_group]
    {core/about.cfg}
[/credits_group]
[credits_group]
    {core/about_i18n.cfg}
[/credits_group]

{core/help.cfg}
{core/hotkeys.cfg}
#ifndef NO_TERRAIN
{core/terrain.cfg}
#endif
{core/units.cfg}
{samguk/units.cfg}
{core/editor/}

[titlescreen_music]
    {DEFAULT_MUSIC_PLAYLIST_NO_EVENT}
    [music]
        name=main_menu.ogg
        ms_before=12000
        append=yes
    [/music]
[/titlescreen_music]

[multiplayer_side]
    id=Custom
    name= _ "직접 설정"
    image="units/unknown-unit.png"
[/multiplayer_side]

#ifdef MULTIPLAYER
{samguk/multiplayer/}
#endif

# 기본 데이터처럼 싱글·대전 모두에서 시대를 읽어, 모드가 바뀔 때 설정을 다시 읽지 않게 한다.
{samguk/multiplayer/era.cfg}

{modifications.cfg}

[ais]
    default_ai_algorithm=ai_default_rca
    [default_config]
        {ai/utils/default_config.cfg}
    [/default_config]
    {ai/ais/}
#ifdef DEBUG_MODE
    {ai/dev/}
#endif
[/ais]

#ifdef EDITOR
[textdomain]
    name="wesnoth-editor"
[/textdomain]
#endif

[textdomain]
    name="wesnoth"
[/textdomain]
[textdomain]
    name="wesnoth-help"
[/textdomain]
[textdomain]
    name="wesnoth-units"
[/textdomain]
[textdomain]
    name="wesnoth-multiplayer"
[/textdomain]
[textdomain]
    name="wesnoth-samguk"
[/textdomain]

#ifndef NO_TERRAIN_GFX
# 기본 데이터처럼 지형 그래픽 정의는 맨 뒤에 둔다.
{core/terrain-graphics.cfg}
#endif

[binary_path]
    path=data/samguk
[/binary_path]
[binary_path]
    path=data/core
[/binary_path]

{advanced_preferences.cfg}

{game_config.cfg}

[textdomain]
    name="wesnoth-lib"
[/textdomain]
