#textdomain wesnoth-samguk
# 삼국 코어의 종족과 유닛 목록.
# 이동 타입, 공통 특성, 기본 종족은 data/core/units.cfg의 [units]에서 오고,
# 엔진이 [units] 블록들을 하나로 합쳐 읽는다.
# 디렉터리 include는 하위 디렉터리를 따라 들어가지 않으므로 세력별로 따로 적는다.

#define SAMGUK_GOGURYEO_NAMES
    male_name_generator= _ <<
main={surname}{given1}{given2}|{surname}{given1}
surname=을지|연|고|명림|을|대|해|온|부|우|재|목
given1=문|무|태|선|건|진|수|정|현|소|도|성|광|명|충|발
given2=덕|소|문|생|기|휼|노|우|평|부|달|만|국|신
>>
    female_name_generator= _ <<
main={surname}{given1}{given2}
surname=을지|연|고|명림|해|우|온
given1=소|화|연|희|아|주|선|옥|미
given2=란|희|연|주|아|진|화|애
>>
#enddef

[units]
    {samguk/units/goguryeo/}
    {samguk/units/baekje/}

    [race]
        id=goguryeo
        male_name= _ "고구려인"
        female_name= _ "고구려인"
        plural_name= _ "고구려인"
        description= _ "압록강과 졸본 일대에서 일어나 만주와 한반도 북부를 다스린 나라의 사람들이다. 험한 산과 넓은 들에서 말을 달리고 사냥하며 자라, 기마와 활쏘기에 뛰어나다. 해에 산다는 세 발 까마귀, 삼족오를 나라의 상징으로 삼았다."
        num_traits=2
        {SAMGUK_GOGURYEO_NAMES}
    [/race]

    # 수군(기본 인어 유닛)은 baekje 종족으로 옮겨, 기본 merman 종족(Merfolk)의 undead_variation=swimmer를 잃었다. 역병·강령술사 유닛을 나중에 추가할 때만 문제가 된다.
    [race]
        id=baekje
        male_name= _ "백제인"
        female_name= _ "백제인"
        plural_name= _ "백제인"
        description= _ "한강 유역에서 나라를 세우고 서해를 건너 바다 너머와 교류한 나라의 사람들이다. 수군이 강하고 불교 문화가 꽃피었으며, 정교한 갑옷과 칼을 만드는 솜씨로 이름났다."
        num_traits=2
        male_name_generator= _ <<
main={surname}{given1}{given2}|{surname}{given1}
surname=부여|사|연|해|진|국|목|백|협|흑치
given1=계|성|의|무|근|초|비|유|아|개|상|충|윤
given2=백|자|왕|상|지|신|복|수|선|평|충|진
>>
        female_name_generator= _ <<
main={surname}{given1}{given2}
surname=부여|사|연|해|진|목
given1=소|은|연|가|미|아|도|화
given2=비|희|란|주|아|련|화
>>
    [/race]

    [race]
        id=dokkaebi
        male_name= _ "도깨비"
        female_name= _ "도깨비"
        plural_name= _ "도깨비"
        description= _ "사람 손때가 묻은 낡은 물건이나 오래된 숲에서 생겨난다는 정령이다. 장난과 씨름과 노래를 좋아하지만, 화가 나면 방망이로 바위도 부순다. 어둠 속에서 힘이 세지고, 다쳐도 상처가 금세 아문다."
        num_traits=2
        undead_variation=troll
        ignore_global_traits=yes
        {TRAIT_STRONG}
        {TRAIT_QUICK}
        {TRAIT_RESILIENT}
        {TRAIT_FEARLESS}
        male_name_generator= _ <<
main={front}{back}
front=두|어|깨|방|뚝|얼|껌|덜|도
back=두리|둑이|비|망이|쇠|돌이|깨비
>>
    [/race]

    [race]
        id=samjogo
        male_name= _ "삼족오 기수"
        female_name= _ "삼족오 기수"
        plural_name= _ "삼족오 기수"
        description= _ "해 속에 산다는 세 발 달린 까마귀, 삼족오와 그를 길들여 타는 고구려의 기수들이다. 삼족오는 높은 산의 둥지에서 자라고, 한 번 마음을 연 기수와는 평생을 함께한다."
        num_traits=2
        undead_variation=gryphon
        {SAMGUK_GOGURYEO_NAMES}
    [/race]
[/units]

#undef SAMGUK_GOGURYEO_NAMES
