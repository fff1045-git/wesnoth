#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/dunefolk/Swordsman.cfg에서 만들었다.

#define PATH_TEMP
units/dunefolk/soldier/#enddef

[unit_type]
    id=bae_swordsman
    name= _ "검대"
    race=baekje
    image="{PATH_TEMP}swordsman.png"
    hitpoints=56
    movement_type=dunearmoredfoot
    movement=5
    experience=68
    level=2
    alignment=lawful
    advances_to=bae_blademaster
    cost=28
    usage=fighter
    description= _ "고리자루 큰칼, 환두대도를 휘두르는 백제의 정예 검사다. 무거운 갑옷을 입고도 빠르게 칼을 놀린다."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "{PATH_TEMP}swordsman-defend2.png" "{PATH_TEMP}swordsman-defend1.png" {SOUND_LIST:HUMAN_HIT} }

    [attack]
        name=scimitar_force
        description= _ "forceful scimitar strike"
        type=blade
        range=melee
        damage=15
        number=2
        icon=attacks/scimitar.png
    [/attack]
    [attack]
        name=scimitar_balance
        description= _ "balanced scimitar slash"
        type=blade
        range=melee
        damage=12
        number=2
        icon=attacks/scimitar.png
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    [/attack]

    [attack_anim]
        [filter_attack]
            name=scimitar_balance
        [/filter_attack]
        start_time=-200
        [frame]
            image="{PATH_TEMP}swordsman.png:500"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=scimitar_force
        [/filter_attack]
        start_time=-300
        [frame]
            image="{PATH_TEMP}swordsman.png:500"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
    [/attack_anim]
[/unit_type]

#undef PATH_TEMP
