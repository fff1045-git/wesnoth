#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/dunefolk/Burner.cfg에서 만들었다.

#define PATH_TEMP
units/dunefolk/burner/#enddef

[unit_type]
    id=bae_burner
    name= _ "화공병"
    race=baekje
    gender=male,female
    image="{PATH_TEMP}burner.png"
    hitpoints=35
    movement_type=dunefoot
    movement=5
    experience=37
    level=1
    alignment=lawful
    advances_to=bae_scorcher
    cost=17
    usage=archer
    description= _ "기름 먹인 횃불과 불화살로 적을 태우는 병사다. 숲과 마을에 숨은 적을 몰아내는 데 쓰인다."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "{PATH_TEMP}burner-defend2.png" "{PATH_TEMP}burner-defend1.png" {SOUND_LIST:HUMAN_HIT} }

    [resistance]
        cold=90
        blade=110
    [/resistance]

    [attack]
        name=dagger
        description= _ "dagger"
        type=blade
        range=melee
        damage=6
        number=2
        icon=attacks/dagger-curved.png
    [/attack]
    [attack]
        name=bomb
        description= _ "tar bomb"
        type=fire
        range=ranged
        damage=7
        number=3
        icon=attacks/fireball.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=dagger
        [/filter_attack]
        start_time=-200
        [frame]
            image="{PATH_TEMP}burner.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS dagger-swish.wav dagger-swish.wav -150}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=bomb
        [/filter_attack]
        start_time=-500
        missile_start_time=-200
        [if]
            hits=yes
            [missile_frame]
                duration=200
                image="projectiles/naphtha-gob-n.png"
                # image_diagonal="projectiles/naphtha-gob-ne.png" # this is just a symmetric ball for now, but will probably change
                offset=0~0.8
                y=-5~-45:100,-45~-5:100
            [/missile_frame]
            {FIRE_BURST_SMALL}
            [+missile_frame]
                y=-5~20
            [/missile_frame]
            [frame]
                image="{PATH_TEMP}burner-fire[1~8].png:[100*8]"
                sound=bow-puny-fire.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [missile_frame]
                duration=200
                image="projectiles/naphtha-gob-n.png"
                # image_diagonal="projectiles/naphtha-gob-ne.png"
                y=-5~-45:100,-45~-5:100
            [/missile_frame]
            [frame]
                image="{PATH_TEMP}burner-fire[1~8].png:[100*8]"
                sound=bow-puny-fire-miss.ogg
            [/frame]
        [/else]
    [/attack_anim]
    [female]
        name= _ "화공병"
        gender=female
        image="{PATH_TEMP}burner+female.png"
        die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
        {DEFENSE_ANIM "{PATH_TEMP}burner+female-defend2.png" "{PATH_TEMP}burner+female-defend1.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }
        [attack_anim]
            [filter_attack]
                name=dagger
            [/filter_attack]
            start_time=-200
            [frame]
                image="{PATH_TEMP}burner+female.png:300"
            [/frame]
            {SOUND:HIT_AND_MISS dagger-swish.wav dagger-swish.wav -150}
        [/attack_anim]
        [attack_anim]
            [filter_attack]
                name=bomb
            [/filter_attack]
            start_time=-500
            missile_start_time=-200
            [if]
                hits=yes
                [missile_frame]
                    duration=150
                    image="projectiles/naphtha-gob-n.png"
                    offset=0~0.8
                    y=-5~-45:100,-45~-5:100
                [/missile_frame]
                {FIRE_BURST_SMALL}
                [+missile_frame]
                    y=-5~20
                [/missile_frame]
                [frame]
                    image="{PATH_TEMP}burner+female-fire[1~8].png:[100*8]"
                    sound=bow-puny-fire.ogg
                [/frame]
            [/if]
            [else]
                hits=no
                [missile_frame]
                    duration=150
                    image="projectiles/naphtha-gob-n.png"
                    y=-5~-45:100,-45~-5:100
                [/missile_frame]
                [frame]
                    image="{PATH_TEMP}burner+female-fire[1~8].png:[100*8]"
                    sound=bow-puny-fire-miss.ogg
                [/frame]
            [/else]
        [/attack_anim]
    [/female]
[/unit_type]

#undef PATH_TEMP
