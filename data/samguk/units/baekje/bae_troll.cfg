#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/trolls/Troll.cfg에서 만들었다.
[unit_type]
    id=bae_troll
    name= _ "큰도깨비"
    race=dokkaebi
    image="units/trolls/grunt.png"
    profile=portraits/trolls/troll.png
    hitpoints=55
    movement_type=largefoot
    movement=5
    experience=58
    level=2
    alignment=chaotic
    advances_to=bae_troll_warrior
    cost=25
    description= _ "방망이 하나로 바위도 깨뜨린다는 큰 도깨비다. 웬만한 상처는 하룻밤이면 다 낫는다."
    die_sound={SOUND_LIST:TROLL_DIE}
    usage=fighter
    [abilities]
        {ABILITY_REGENERATES}
    [/abilities]
    [attack]
        name=club
        description=_"club"
        type=impact
        range=melee
        damage=14
        number=2
    [/attack]
    {DEFENSE_ANIM "units/trolls/grunt-defend2.png" "units/trolls/grunt-defend.png" {SOUND_LIST:TROLL_HIT} }
    [attack_anim]
        [filter_attack]
            name=club
        [/filter_attack]
        start_time=-300
        [frame]
            image="units/trolls/grunt.png:25"
        [/frame]
        [frame]
            image="units/trolls/grunt-attack-[1~4,3].png:[75*3,95,80]"
        [/frame]
        {SOUND:HIT_AND_MISS club.ogg {SOUND_LIST:MISS} -200}
        [frame]
            image="units/trolls/grunt-defend.png:75"
        [/frame]
    [/attack_anim]
[/unit_type]
