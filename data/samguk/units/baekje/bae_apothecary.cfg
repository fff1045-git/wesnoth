#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/dunefolk/Apothecary.cfg에서 만들었다.

#define PATH_TEMP
units/dunefolk/herbalist/#enddef

[unit_type]
    id=bae_apothecary
    name= _ "의승"
    race=baekje
    image="{PATH_TEMP}apothecary.png"
    profile="portraits/dunefolk/herbalist.webp"
    hitpoints=45
    movement_type=dunefoot
    [abilities]
        {ABILITY_EXTRA_HEAL}
        {ABILITY_SELF_HEAL}
    [/abilities]
    movement=5
    experience=50
    level=2
    alignment=liminal
    advances_to=bae_luminary
    cost=23
    usage=healer
    description= _ "의술에 정통한 승려다. 상처를 치료할 뿐 아니라 독도 풀어낸다."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "{PATH_TEMP}apothecary-defend2.png" "{PATH_TEMP}apothecary-defend1.png" {SOUND_LIST:HUMAN_HIT} }

    [resistance]
        blade=110
        pierce=90
    [/resistance]

    [attack]
        name=mace
        description= _ "mace"
        type=impact
        range=melee
        damage=6
        number=4
        icon=attacks/mace.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=mace
        [/filter_attack]
        start_time=-200
        [frame]
            image="{PATH_TEMP}apothecary.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS mace.ogg mace-miss.ogg -100}
    [/attack_anim]
[/unit_type]

#undef PATH_TEMP
