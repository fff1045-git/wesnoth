#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/dunefolk/Blademaster.cfg에서 만들었다.

#define PATH_TEMP
units/dunefolk/soldier/#enddef

[unit_type]
    id=bae_blademaster
    name= _ "검대장"
    race=baekje
    image="{PATH_TEMP}blademaster.png"
    hitpoints=76
    movement_type=dunearmoredfoot
    movement=5
    level=3
    alignment=lawful
    experience=150
    advances_to=null
    {AMLA_DEFAULT}
    cost=57
    usage=fighter
    description= _ "검대를 이끄는 노련한 검객이다. 한 번의 칼질로 여러 적을 베어 넘긴다."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "{PATH_TEMP}blademaster.png" "{PATH_TEMP}blademaster.png" {SOUND_LIST:HUMAN_HIT} }

    [attack]
        name=sword
        description= _ "scimitar"
        type=blade
        range=melee
        damage=15
        number=3
        icon=attacks/scimitar.png
    [/attack]
    [attack]
        name=sword
        description= _ "scimitar"
        type=blade
        range=melee
        damage=18
        number=2
        icon=attacks/scimitar.png
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
    [/attack]

    [attack_anim]
        [filter_attack]
            name=sword
        [/filter_attack]
        start_time=-200
        [frame]
            image="{PATH_TEMP}blademaster.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
    [/attack_anim]
[/unit_type]

#undef PATH_TEMP
