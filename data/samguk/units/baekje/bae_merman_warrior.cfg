#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/merfolk/Warrior.cfg에서 만들었다.
[unit_type]
    id=bae_merman_warrior
    name= _ "수군 무사"
    race=baekje
    image="units/merfolk/warrior.png"
    profile=portraits/merfolk/fighter.webp
    hitpoints=50
    movement_type=swimmer
    movement=6
    experience=60
    level=2
    alignment=lawful
    advances_to=bae_merman_triton
    cost=24
    usage=fighter
    description= _ "수많은 해전을 치른 수군 무사다. 강과 바다를 자기 집처럼 누빈다."
    die_sound=mermen-die.ogg
    {DEFENSE_ANIM "units/merfolk/warrior-defend-2.png" "units/merfolk/warrior-defend-1.png" mermen-hit.wav }
    [attack]
        name=trident
        description=_"trident"
        type=pierce
        range=melee
        damage=10
        number=3
    [/attack]
    [attack_anim]
        [filter_attack]
            name=trident
        [/filter_attack]
        offset=0~0.3,0.3~0
        direction=se,sw
        start_time=-450
        [frame]
            image="units/merfolk/warrior-attack-[1~9].png:100"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -150}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=trident
        [/filter_attack]
        direction=n,ne,nw,s
        start_time=-200
        [frame]
            image="units/merfolk/warrior.png:50"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -150}
        [frame]
            image="units/merfolk/warrior.png:250"
        [/frame]
        [frame]
            image="units/merfolk/warrior.png:50"
        [/frame]
    [/attack_anim]
[/unit_type]
