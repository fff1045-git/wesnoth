#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/dunefolk/Soldier.cfg에서 만들었다.

#define PATH_TEMP
units/dunefolk/soldier/#enddef

[unit_type]
    id=bae_soldier
    name= _ "백제 보병"
    race=baekje
    image="{PATH_TEMP}soldier.png"
    hitpoints=41
    movement_type=dunearmoredfoot
    movement=5
    experience=39
    level=1
    alignment=lawful
    advances_to=bae_swordsman
    cost=17
    usage=fighter
    description= _ "찰갑을 입고 창과 방패를 든 백제의 정규 보병이다. 단단한 방어로 전선을 지킨다."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "{PATH_TEMP}soldier-defend2.png" "{PATH_TEMP}soldier-defend1.png" {SOUND_LIST:HUMAN_HIT} }

    [attack]
        name=scimitar
        description= _ "scimitar"
        type=blade
        range=melee
        damage=11
        number=2
        icon=attacks/scimitar.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=scimitar
        [/filter_attack]
        start_time=-200
        [frame]
            image="{PATH_TEMP}soldier.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
    [/attack_anim]
[/unit_type]

#undef PATH_TEMP
