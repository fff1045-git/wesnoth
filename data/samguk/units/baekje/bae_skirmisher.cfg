#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/dunefolk/Skirmisher.cfg에서 만들었다.

#define PATH_TEMP
units/dunefolk/skirmisher/#enddef

[unit_type]
    id=bae_skirmisher
    name= _ "척후병"
    race=baekje
    gender=female
    image="{PATH_TEMP}skirmisher.png"
    hitpoints=29
    movement_type=duneelusivefoot
    movement=6
    experience=36
    level=1
    alignment=lawful
    advances_to=bae_strider
    cost=16
    usage=fighter
    description= _ "가벼운 차림으로 적진 깊숙이 스며드는 척후병이다. 적의 진형 사이를 빠져나가 후방을 어지럽힌다."
    [abilities]
        {ABILITY_SKIRMISHER}
    [/abilities]
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    {STANDING_ANIM_DIRECTIONAL "{PATH_TEMP}skirmisher.png" "{PATH_TEMP}skirmisher-ne.png"}
    {DEFENSE_ANIM_DIRECTIONAL_FILTERED "{PATH_TEMP}skirmisher-defend2.png" "{PATH_TEMP}skirmisher-defend1.png" "{PATH_TEMP}skirmisher-ne-defend2.png" "{PATH_TEMP}skirmisher-ne-defend1.png" {SOUND_LIST:HUMAN_FEMALE_HIT} ()}
    #    {DEFENSE_ANIM "{PATH_TEMP}skirmisher-defend2.png" "{PATH_TEMP}skirmisher-defend1.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [attack]
        name=spear
        description= _ "spear"
        type=pierce
        range=melee
        damage=4
        number=4
        icon=attacks/spear.png
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    [/attack]
    [attack]
        name=sling
        description= _ "sling"
        type=impact
        range=ranged
        damage=6
        number=1
        icon=attacks/sling.png
    [/attack]
    [attack_anim]
        [filter_attack]
            name=spear
        [/filter_attack]
        start_time=-250
        [if]
            direction=s,se,sw
            [frame]
                image="{PATH_TEMP}skirmisher.png:300"
            [/frame]
        [/if]
        [else]
            direction=n,ne,nw
            [frame]
                image="{PATH_TEMP}skirmisher-ne.png:300"
            [/frame]
        [/else]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=sling
        [/filter_attack]
        start_time=-225
        missile_start_time=-150
        [if]
            hits=yes
            [missile_frame]
                duration=150
                image="projectiles/bolas-n.png"
                image_diagonal="projectiles/bolas-ne.png"
                offset=0~0.8
            [/missile_frame]
        [/if]
        [else]
            hits=no
            [missile_frame]
                duration=150
                image="projectiles/bolas-n.png"
                image_diagonal="projectiles/bolas-ne.png"
            [/missile_frame]
        [/else]
        {SOUND:HIT_AND_MISS sling.ogg sling-miss.ogg -100}
        [if]
            direction=s,se,sw
            [frame]
                image="{PATH_TEMP}skirmisher.png:300"
            [/frame]
        [/if]
        [else]
            direction=n,ne,nw
            [frame]
                image="{PATH_TEMP}skirmisher-ne.png:300"
            [/frame]
        [/else]
    [/attack_anim]
[/unit_type]

#undef PATH_TEMP
