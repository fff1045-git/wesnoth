#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/dunefolk/Harrier.cfg에서 만들었다.

#define PATH_TEMP
units/dunefolk/skirmisher/#enddef

[unit_type]
    id=bae_harrier
    name= _ "유격대장"
    race=baekje
    gender=female
    image="{PATH_TEMP}harrier.png"
    hitpoints=53
    movement_type=duneelusivefoot
    movement=7
    experience=150
    level=3
    alignment=lawful
    advances_to=null
    {AMLA_DEFAULT}
    cost=50
    usage=mixed fighter
    [abilities]
        {ABILITY_SKIRMISHER}
    [/abilities]
    description= _ "유격병들을 이끌고 적의 보급로를 끊는 데 이골이 난 장수다."
    die_sound={SOUND_LIST:HUMAN_FEMALE_DIE}
    {DEFENSE_ANIM "{PATH_TEMP}harrier-defend2.png" "{PATH_TEMP}harrier-defend1.png" {SOUND_LIST:HUMAN_FEMALE_HIT} }

    [attack]
        name=spear
        description= _ "spear"
        type=pierce
        range=melee
        damage=8
        number=4
        icon=attacks/spear.png
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    [/attack]
    [attack]
        name=bolas
        description= _ "bolas"
        type=impact
        range=ranged
        damage=6
        number=3
        icon=attacks/bolas.png
        [specials]
            {WEAPON_SPECIAL_SLOW}
        [/specials]
    [/attack]

    [attack_anim]
        [filter_attack]
            name=spear
        [/filter_attack]
        start_time=-250
        [frame]
            image="{PATH_TEMP}harrier.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=bolas
        [/filter_attack]
        start_time=-225
        missile_start_time=-150
        [if]
            hits=yes
            [missile_frame]
                duration=150
                image="projectiles/bolas-n.png"
                image_diagonal="projectiles/bolas-ne.png"
                offset=0~0.8
            [/missile_frame]
            [frame]
                image="{PATH_TEMP}harrier.png:300"
                sound=sling.ogg
            [/frame]
        [/if]
        [else]
            hits=no
            [missile_frame]
                duration=150
                image="projectiles/bolas-n.png"
                image_diagonal="projectiles/bolas-ne.png"
            [/missile_frame]
            [frame]
                image="{PATH_TEMP}harrier.png:300"
                sound=sling-miss.ogg
            [/frame]
        [/else]
    [/attack_anim]
[/unit_type]

#undef PATH_TEMP
