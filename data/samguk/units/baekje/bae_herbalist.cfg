#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/dunefolk/Herbalist.cfg에서 만들었다.

#define PATH_TEMP
units/dunefolk/herbalist/#enddef

[unit_type]
    id=bae_herbalist
    name= _ "승병"
    race=baekje
    image="{PATH_TEMP}herbalist.png"
    profile="portraits/dunefolk/herbalist.webp"
    hitpoints=32
    movement_type=dunefoot
    [abilities]
        {ABILITY_SELF_HEAL}
        {ABILITY_HEALS}
    [/abilities]
    movement=5
    experience=36
    level=1
    alignment=liminal
    advances_to=bae_apothecary
    cost=13
    usage=healer
    description= _ "부처의 가르침을 따르면서도 나라를 지키려 무기를 든 승려다. 약초와 기도로 다친 아군을 돌본다."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "{PATH_TEMP}herbalist-defend2.png" "{PATH_TEMP}herbalist-defend1.png" {SOUND_LIST:HUMAN_HIT} }

    [resistance]
        blade=110
    [/resistance]

    [attack]
        name=mace
        description= _ "mace"
        type=impact
        range=melee
        damage=4
        number=3
        icon=attacks/mace.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=mace
        [/filter_attack]
        start_time=-200
        [frame]
            image="{PATH_TEMP}herbalist.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS mace.ogg mace-miss.ogg -100}
    [/attack_anim]
[/unit_type]

#undef PATH_TEMP
