#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/dunefolk/Warmaster.cfg에서 만들었다.

#define PATH_TEMP
units/dunefolk/soldier/#enddef

[unit_type]
    id=bae_warmaster
    name= _ "상좌평"
    race=baekje
    image="{PATH_TEMP}warmaster.png"
    hitpoints=59
    movement_type=dunearmoredfoot
    movement=5
    experience=150
    level=3
    alignment=lawful
    advances_to=null
    {AMLA_DEFAULT}
    cost=57
    usage=fighter
    [abilities]
        {ABILITY_LEADERSHIP}
    [/abilities]
    description= _ "좌평들 가운데 으뜸인 상좌평이다. 나라의 군사와 정사를 함께 맡는다."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {LEADING_ANIM "{PATH_TEMP}warmaster-leading2.png" "{PATH_TEMP}warmaster-leading1.png" (-10,-38)}
    {DEFENSE_ANIM "{PATH_TEMP}warmaster.png" "{PATH_TEMP}warmaster.png" {SOUND_LIST:HUMAN_HIT} }

    [attack]
        name=scimitar
        description= _ "scimitar"
        type=blade
        range=melee
        damage=9
        number=4
        icon=attacks/scimitar.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=scimitar
        [/filter_attack]
        start_time=-200
        [frame]
            image="{PATH_TEMP}warmaster.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
    [/attack_anim]
[/unit_type]

#undef PATH_TEMP
