#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/dunefolk/Captain.cfg에서 만들었다.

#define PATH_TEMP
units/dunefolk/soldier/#enddef

[unit_type]
    id=bae_captain
    name= _ "좌평"
    race=baekje
    image="{PATH_TEMP}captain.png"
    hitpoints=48
    movement_type=dunearmoredfoot
    movement=5
    experience=74
    level=2
    alignment=lawful
    advances_to=bae_warmaster
    cost=29
    usage=fighter
    [abilities]
        {ABILITY_LEADERSHIP}
    [/abilities]
    description= _ "백제 최고 관직인 좌평은 전쟁이 나면 직접 군대를 이끈다. 곁에 선 병사들의 사기를 북돋는다."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "{PATH_TEMP}captain-defend2.png" "{PATH_TEMP}captain-defend1.png" {SOUND_LIST:HUMAN_HIT} }
    {LEADING_ANIM "{PATH_TEMP}captain-leading2.png" "{PATH_TEMP}captain-leading1.png" (-18,-36)}

    [attack]
        name=scimitar
        description= _ "scimitar"
        type=blade
        range=melee
        damage=9
        number=3
        icon=attacks/scimitar.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=scimitar
        [/filter_attack]
        start_time=-200
        [frame]
            image="{PATH_TEMP}captain.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
    [/attack_anim]
[/unit_type]

#undef PATH_TEMP
