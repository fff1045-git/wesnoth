#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/merfolk/Fighter.cfg에서 만들었다.
[unit_type]
    id=bae_merman_fighter
    name= _ "수군"
    race=baekje
    image="units/merfolk/fighter.png"
    profile=portraits/merfolk/fighter.webp
    hitpoints=36
    movement_type=swimmer
    movement=6
    experience=34
    level=1
    alignment=lawful
    advances_to=bae_merman_warrior
    cost=14
    usage=fighter
    description= _ "바다 건너 왜와 중국을 오가던 백제 수군의 병사다. 물 위와 물가에서 누구보다 잘 싸운다."
    die_sound=mermen-die.ogg
    {DEFENSE_ANIM "units/merfolk/fighter-defend-1.png" "units/merfolk/fighter-defend-2.png" mermen-hit.wav }
    [attack]
        name=trident
        description=_"trident"
        type=pierce
        range=melee
        damage=6
        number=3
    [/attack]
    [attack_anim]
        [filter_attack]
            name=trident
        [/filter_attack]
        offset=0~0.3,0.3~0
        direction=se,sw
        start_time=-225
        [frame]
            image="units/merfolk/fighter-attack-[1~6,2,1].png:75"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -75}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=trident
        [/filter_attack]
        direction=n,ne,nw,s
        start_time=-200
        [frame]
            image="units/merfolk/fighter.png:50"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -150}
        [frame]
            image="units/merfolk/fighter.png:250"
        [/frame]
        [frame]
            image="units/merfolk/fighter.png:50"
        [/frame]
    [/attack_anim]
[/unit_type]
