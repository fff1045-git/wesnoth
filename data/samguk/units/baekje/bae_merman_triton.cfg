#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/merfolk/Triton.cfg에서 만들었다.
[unit_type]
    id=bae_merman_triton
    name= _ "수군 장수"
    race=baekje
    image="units/merfolk/triton.png"
    profile=portraits/merfolk/triton.webp
    hitpoints=60
    movement_type=swimmer
    movement=6
    experience=150
    level=3
    alignment=lawful
    advances_to=null
    {AMLA_DEFAULT}
    cost=46
    usage=fighter
    # wmllint: local spelling tritons
    description= _ "백제 함대를 이끄는 수군 장수다. 물길을 훤히 아는 그를 강 위에서 이기기는 어렵다."
    die_sound=mermen-die.ogg
    {DEFENSE_ANIM "units/merfolk/triton-defend2.png" "units/merfolk/triton-defend1.png" mermen-hit.wav }
    [attack]
        name=trident
        description=_"trident"
        type=pierce
        range=melee
        damage=14
        number=3
        icon=attacks/trident2-pierce.png
    [/attack]
    [attack]
        name=trident
        description=_"trident"
        type=blade
        range=melee
        damage=19
        number=2
        icon=attacks/trident2-blade.png
    [/attack]
    [attack_anim]
        [filter_attack]
            name=trident
            type=blade
        [/filter_attack]
        start_time=-200
        [frame]
            image="units/merfolk/triton.png:75"
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
        [frame]
            image="units/merfolk/triton.png:175"
        [/frame]
        [frame]
            image="units/merfolk/triton.png:100"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=trident
            type=pierce
        [/filter_attack]
        start_time=-200
        [frame]
            image="units/merfolk/triton.png:75"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -125}
        [frame]
            image="units/merfolk/triton.png:175"
        [/frame]
        [frame]
            image="units/merfolk/triton.png:100"
        [/frame]
    [/attack_anim]
[/unit_type]
