#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/trolls/Warrior.cfg에서 만들었다.
[unit_type]
    id=bae_troll_warrior
    name= _ "도깨비 대장"
    race=dokkaebi
    image="units/trolls/warrior.png"
    profile=portraits/trolls/troll-warrior.webp
    hitpoints=70
    movement_type=largefoot
    movement=5
    experience=150
    level=3
    alignment=chaotic
    advances_to=null
    {AMLA_DEFAULT}
    cost=49
    usage=fighter
    description= _ "도깨비들의 우두머리다. 금은보화보다 씨름 한 판을 더 좋아한다고 전해진다."
    die_sound={SOUND_LIST:TROLL_DIE}
    [abilities]
        {ABILITY_REGENERATES}
    [/abilities]
    [standing_anim]
        start_time=0
        [frame]
            image="units/trolls/warrior-breeze-s-[1~3,2].png:290"
        [/frame]
    [/standing_anim]
    [standing_anim]
        start_time=0
        {WOUNDED_UNIT ()}
        [frame]
            image="units/trolls/warrior-bob-s-[1~4,3,2].png:[620,420,310,620,420,510]"
        [/frame]
    [/standing_anim]
    [attack]
        name=hammer
        description=_"hammer"
        icon=attacks/hammer-troll.png
        type=impact
        range=melee
        damage=20
        number=2
    [/attack]
    {DEFENSE_ANIM "units/trolls/warrior-defend2.png" "units/trolls/warrior-defend.png" {SOUND_LIST:TROLL_HIT} }
    [attack_anim]
        [filter_attack]
            name=hammer
        [/filter_attack]
        start_time=-300
        [frame]
            image="units/trolls/warrior.png:25"
        [/frame]
        [frame]
            image="units/trolls/warrior-attack-[1~4,3,1].png:[75,50,75,175,75,25]"
        [/frame]
        {SOUND:HIT_AND_MISS mace.ogg mace-miss.ogg -100}
        [frame]
            image="units/trolls/warrior.png:50"
        [/frame]
    [/attack_anim]
[/unit_type]
