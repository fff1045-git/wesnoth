#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/dunefolk/Luminary.cfg에서 만들었다.

#define PATH_TEMP
units/dunefolk/herbalist/#enddef

[unit_type]
    id=bae_luminary
    name= _ "대덕"
    race=baekje
    image="{PATH_TEMP}luminary.png"
    profile="portraits/dunefolk/herbalist.webp"
    hitpoints=52
    movement_type=dunefoot
    [abilities]
        {ABILITY_CURES}
        {ABILITY_SELF_HEAL}
    [/abilities]
    movement=5
    experience=150
    level=3
    alignment=liminal
    {AMLA_DEFAULT}
    cost=38
    usage=healer
    description= _ "높은 덕을 쌓은 큰스님이다. 그 곁에 있으면 지친 병사들도 다시 일어선다."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "{PATH_TEMP}luminary-defend2.png" "{PATH_TEMP}luminary-defend1.png" {SOUND_LIST:HUMAN_HIT} }

    [resistance]
        blade=110
        pierce=80
    [/resistance]

    [attack]
        name=mace
        description= _ "mace"
        type=impact
        range=melee
        damage=9
        number=4
        icon=attacks/mace.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=mace
        [/filter_attack]
        start_time=-200
        [frame]
            image="{PATH_TEMP}luminary.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS mace.ogg mace-miss.ogg -100}
    [/attack_anim]
[/unit_type]

#undef PATH_TEMP
