#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/humans/Loyalist_Pikeman.cfg에서 만들었다.
[unit_type]
    id=gog_pikeman
    name= _ "장창수"
    race=goguryeo
    image="units/human-loyalists/pikeman.png"
    profile="portraits/humans/pikeman.webp"
    hitpoints=55
    movement_type=smallfoot
    movement=5
    experience=69
    level=2
    alignment=lawful
    advances_to=gog_halberdier
    cost=24
    usage=fighter
    description= _ "더 긴 창을 다루도록 훈련받은 창수다. 기병의 돌격을 정면으로 받아내는 데 특히 뛰어나다."
    [special_note]
        note= _ "Compared to other loyalists, Pikemen have a higher resistance to ‘pierce’ attacks."
    [/special_note]
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/human-loyalists/pikeman-defend-2.png" "units/human-loyalists/pikeman-defend-1.png" {SOUND_LIST:HUMAN_HIT} }
    [resistance]
        pierce=60
    [/resistance]
    # [death]
    #    start_time=0
    #    [frame]
    #        image="units/human-loyalists/pikeman-die-[1~5].png:80"
    #    [/frame]
    # [/death]
    [attack]
        name=pike
        description=_"pike"
        type=pierce
        range=melee
        damage=10
        number=3
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    [/attack]
    # [idle_anim]
    #    {STANDARD_IDLE_FILTER}
    #    start_time=0
    #    [frame]
    #        image="units/human-loyalists/pikeman-idle-[1~4,3~1].png:[100*3,1000,100*3]"
    #    [/frame]
    # [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=pike
        [/filter_attack]
        direction=ne,nw
        start_time=-250
        [frame]
            image="units/human-loyalists/pikeman.png:100"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -250}
        [frame]
            image="units/human-loyalists/pikeman-attack-ne.png:250"
        [/frame]
        [frame]
            image="units/human-loyalists/pikeman.png:75"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=pike
        [/filter_attack]
        direction=se,sw
        start_time=-250
        [frame]
