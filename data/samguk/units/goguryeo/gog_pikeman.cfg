            name=pike
        [/filter_attack]
        direction=n
        start_time=-250
        [frame]
            image="units/human-loyalists/pikeman.png:50"
        [/frame]
        [frame]
            image="units/human-loyalists/pikeman-attack-ne.png:100"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -100}
        [frame]
