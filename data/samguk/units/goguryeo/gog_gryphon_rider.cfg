#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/gryphons/Gryphon_Rider.cfg에서 만들었다.
[unit_type]
    id=gog_gryphon_rider
    name= _ "삼족오 기수"
    race=samjogo
    image="units/dwarves/gryphon-rider.png"
    profile="portraits/dwarves/gryphon-rider.webp"
    hitpoints=34
    movement_type=fly
    movement=8
    experience=46
    level=1
    alignment=neutral
    advances_to=gog_gryphon_master
    cost=23
    usage=scout
    description= _ "해에 산다는 세 발 까마귀, 삼족오를 길들여 타는 기수다. 산과 강을 가리지 않고 날아가 적진을 정찰한다."
    die_sound={SOUND_LIST:GRYPHON_DIE}
    [defense]
        mountains=40
    [/defense]
    [resistance]
        arcane=90
    [/resistance]
    [attack]
        name=claws
        description=_"claws"
        icon=attacks/claws-animal.png
        type=blade
        range=melee
        damage=12
        number=2
    [/attack]
    [standing_anim]
        start_time=0
        layer=60
        [frame]
            image="units/dwarves/gryphon-rider-flying-[1~8].png:150"
        [/frame]
    [/standing_anim]
    [movement_anim]
        start_time=0
        [frame]
            image="units/dwarves/gryphon-rider-flying-[1~8].png:150"
        [/frame]
    [/movement_anim]

    {DEFENSE_ANIM "units/dwarves/gryphon-rider-flying-4.png" "units/dwarves/gryphon-rider-flying-5.png" {SOUND_LIST:GRYPHON_HIT} }
    [attack_anim]
        [filter_attack]
            name=claws
        [/filter_attack]
        start_time=-200
        [frame]
            image="units/dwarves/gryphon-rider-flying-[5,4,5].png:[100,200,100]"
        [/frame]
        {SOUND:HIT_AND_MISS claws.ogg {SOUND_LIST:MISS} -100}
    [/attack_anim]
[/unit_type]
