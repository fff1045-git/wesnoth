#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/dunefolk/Rider.cfg에서 만들었다.

#define PATH_TEMP
units/dunefolk/rider/#enddef

[unit_type]
    id=gog_rider
    name= _ "궁기병"
    race=goguryeo
    image="{PATH_TEMP}rider.png"
    hitpoints=33
    movement_type=dunehorse
    movement=8
    experience=49
    level=1
    alignment=liminal
    advances_to=gog_horse_archer
    cost=18
    usage=scout
    undead_variation=mounted
    description= _ "가볍게 무장하고 말을 달리는 기병이다. 넓은 들판을 빠르게 누비며 마을을 차지하고 적의 움직임을 살핀다."
    die_sound=horse-die.ogg
    {DEFENSE_ANIM "{PATH_TEMP}rider.png" "{PATH_TEMP}rider.png" {SOUND_LIST:HORSE_HIT} }

    [attack]
        name=mace
        description= _ "mace"
        type=impact
        range=melee
        damage=5
        number=2
        icon=attacks/mace.png
    [/attack]
    [attack]
        name=composite bow
        description= _ "composite bow"
        type=pierce
        range=ranged
        damage=5
        number=3
        icon=attacks/bow-short.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=mace
        [/filter_attack]
        start_time=-250
        horse_sound_start_time=-250
        [frame]
            image="{PATH_TEMP}rider.png:400"
        [/frame]
        [horse_sound_frame]
            sound=horse-canter.wav
        [/horse_sound_frame]
        {SOUND:HIT_AND_MISS mace.ogg mace-miss.ogg -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=composite bow
        [/filter_attack]
        start_time=-250
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        [frame]
            image="{PATH_TEMP}rider.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS bow-puny.ogg bow-puny-miss.ogg -225}
    [/attack_anim]
[/unit_type]

#undef PATH_TEMP
