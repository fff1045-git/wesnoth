#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/dunefolk/Horse_Archer.cfg에서 만들었다.

#define PATH_TEMP
units/dunefolk/rider/#enddef

[unit_type]
    id=gog_horse_archer
    name= _ "기마궁수"
    race=goguryeo
    image="{PATH_TEMP}horse-archer.png"
    hitpoints=44
    movement_type=dunehorse
    movement=8
    experience=62
    level=2
    alignment=liminal
    advances_to=gog_windbolt
    cost=38
    usage=archer
    undead_variation=mounted
    description= _ "달리는 말 위에서 몸을 돌려 활을 쏘는 고구려 기마궁술의 달인이다. 무용총 수렵도에 그려진 사냥꾼들이 바로 이들이다."
    die_sound=horse-die.ogg
    {DEFENSE_ANIM "{PATH_TEMP}horse-archer.png" "{PATH_TEMP}horse-archer.png" {SOUND_LIST:HORSE_HIT} }

    [attack]
        name=mace
        description= _ "mace"
        type=impact
        range=melee
        damage=7
        number=2
        icon=attacks/mace.png
    [/attack]
    [attack]
        name=composite bow
        description= _ "composite bow"
        type=pierce
        range=ranged
        damage=7
        number=4
        icon=attacks/bow-short-reinforced.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=mace
        [/filter_attack]
        start_time=-250
        horse_sound_start_time=-250
        [frame]
            image="{PATH_TEMP}horse-archer.png:400"
        [/frame]
        [horse_sound_frame]
            sound=horse-canter.wav
        [/horse_sound_frame]
        {SOUND:HIT_AND_MISS mace.ogg mace-miss.ogg -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=composite bow
        [/filter_attack]
        start_time=-250
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        [frame]
            image="{PATH_TEMP}horse-archer.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS bow-puny.ogg bow-puny-miss.ogg -225}
    [/attack_anim]
[/unit_type]

#undef PATH_TEMP
