#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/humans/Loyalist_Halberdier.cfg에서 만들었다.
[unit_type]
    id=gog_halberdier
    name= _ "극수"
    race=goguryeo
    image="units/human-loyalists/halberdier.png"
    profile="portraits/humans/halberdier.webp"
    hitpoints=72
    movement_type=smallfoot
    movement=5
    experience=150
    level=3
    alignment=lawful
    advances_to=null
    {AMLA_DEFAULT}
    cost=52
    usage=fighter
    description= _ "날이 달린 극으로 찌르고 베는 노련한 보병이다. 성문과 고갯길을 지키는 데 주로 배치된다."
    [special_note]
        note= _ "Compared to other loyalists, Halberdiers have a higher resistance to ‘pierce’ attacks."
    [/special_note]
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM "units/human-loyalists/halberdier-defend-2.png" "units/human-loyalists/halberdier-defend-1.png" {SOUND_LIST:HUMAN_HIT} }
    [resistance]
        pierce=60
    [/resistance]
    [attack]
        name=halberd
        description=_"halberd"
        icon=attacks/halberd.png
        type=pierce
        range=melee
        damage=15
        number=3
        [specials]
            {WEAPON_SPECIAL_FIRSTSTRIKE}
        [/specials]
    [/attack]
    [attack]
        name=halberd
        description=_"halberd"
        icon=attacks/halberd.png
        type=blade
        range=melee
        damage=19
        number=2
    [/attack]
    # [idle_anim]
    #    {STANDARD_IDLE_FILTER}
    #    start_time=0
    #    [frame]
    #        image="units/human-loyalists/halberdier-idle-[1~12,2,1].png:100"
    #    [/frame]
    # [/idle_anim]
    [attack_anim]
        [filter_attack]
            name=halberd
            type=blade
        [/filter_attack]
        start_time=-380
        offset=0.0:210,0.0~0.65:150,0.65:70,0.65~0.0:200
        [frame]
            image="units/human-loyalists/halberdier-slash-se-[1~4,1].png:[130,100,100,125,100]"
        [/frame]
        [frame]
            image="units/human-loyalists/halberdier.png:75"
        [/frame]
        {SOUND:HIT_AND_MISS axe.ogg {SOUND_LIST:MISS} -50}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=halberd
            type=pierce
        [/filter_attack]
        direction=ne,nw
        start_time=-200
        [frame]
            image="units/human-loyalists/halberdier.png:50"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -100}
        [frame]
            image="units/human-loyalists/halberdier-pierce-ne.png:200"
        [/frame]
        [frame]
            image="units/human-loyalists/halberdier.png:100"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=halberd
            type=pierce
        [/filter_attack]
        direction=se,sw
        start_time=-200
        [frame]
            image="units/human-loyalists/halberdier-pierce-se-[1,2,1].png:[100*3]"
        [/frame]
        [frame]
            image="units/human-loyalists/halberdier.png:100"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=halberd
            type=pierce
        [/filter_attack]
        direction=n
        start_time=-250
        [frame]
            image="units/human-loyalists/halberdier.png:50"
        [/frame]
        [frame]
            image="units/human-loyalists/halberdier-pierce-[ne,n,ne].png:[100,200,50]"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -100}
        [frame]
            image="units/human-loyalists/halberdier.png:25"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=halberd
            type=pierce
        [/filter_attack]
        direction=s
        start_time=-250
        [frame]
            image="units/human-loyalists/halberdier.png:50"
        [/frame]
        {SOUND:HIT_AND_MISS spear.ogg spear-miss.ogg -100}
        [frame]
            image="units/human-loyalists/halberdier-pierce-[se-1,s,se-1].png:[50,250,50]"
        [/frame]
        [frame]
            image="units/human-loyalists/halberdier.png:25"
        [/frame]
    [/attack_anim]
[/unit_type]
