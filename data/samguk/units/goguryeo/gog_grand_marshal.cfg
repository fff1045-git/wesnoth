#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/humans/Loyalist_Grand_Marshal.cfg에서 만들었다.
[unit_type]
    id=gog_grand_marshal
    name= _ "대모달"
    race=goguryeo
    image="units/human-loyalists/marshal.png"
    profile="portraits/humans/marshal.webp"
    [leading_anim]
        start_time=-150
        [frame]
            image="units/human-loyalists/marshal-leading.png:300"
        [/frame]
    [/leading_anim]
    hitpoints=68
    movement_type=smallfoot
    movement=6
    experience=200
    level=4
    alignment=lawful
    advances_to=null
    {AMLA_DEFAULT}
    cost=101
    usage=fighter
    description= _ "고구려 군사 조직의 꼭대기에 선 최고 지휘관이다. 그의 이름만으로도 적국의 성이 문을 연다는 말이 있다."
    die_sound={SOUND_LIST:HUMAN_DIE}
    {DEFENSE_ANIM_RANGE "units/human-loyalists/marshal-defend-2.png" "units/human-loyalists/marshal-defend-1.png" {SOUND_LIST:HUMAN_HIT} melee }
    {DEFENSE_ANIM_RANGE "units/human-loyalists/marshal-crossbow-defend.png" "units/human-loyalists/marshal-crossbow.png" {SOUND_LIST:HUMAN_HIT} ranged }
    [resistance]
        blade=80
        pierce=80
        impact=80
    [/resistance]
    [abilities]
        {ABILITY_LEADERSHIP}
    [/abilities]
    [attack]
        name=sword
        description=_"longsword"
        icon=attacks/greatsword-human.png
        type=blade
        range=melee
        damage=10
        number=4
    [/attack]
    [attack]
        name=crossbow
        description=_"crossbow"
        icon=attacks/crossbow-human.png
        type=pierce
        range=ranged
        damage=8
        number=3
    [/attack]
    [death]
        start_time=0
        [frame]
            image="units/human-loyalists/marshal-die-[1~10].png:[75*8,175,125]"
        [/frame]
    [/death]
    [attack_anim]
        [filter_attack]
            name=crossbow
        [/filter_attack]
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        start_time=-400
        [frame]
            image="units/human-loyalists/marshal-crossbow.png:100"
        [/frame]
        {SOUND:HIT_AND_MISS crossbow.ogg crossbow-miss.ogg -300}
        [frame]
            image="units/human-loyalists/marshal-crossbow-attack[1~2].png:150"
        [/frame]
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=sword
        [/filter_attack]
        start_time=-300
        [frame]
            image="units/human-loyalists/marshal.png:50"
            offset=0.0~0.1
        [/frame]
        [frame]
            image="units/human-loyalists/marshal-defend-1.png:50"
            offset=0.1~0.15
        [/frame]
        [frame]
            image="units/human-loyalists/marshal-attack-sword[1~5].png:[100,75,100,50,75]"
            offset=0.15~0.35:100,0.35~0.45:75,0.45~0.5:100,0.5:20,0.5~0.4:30,0.4~0.2:75
        [/frame]
        {SOUND:HIT_AND_MISS {SOUND_LIST:SWORD_SWISH} {SOUND_LIST:MISS} -100}
        [frame]
            image="units/human-loyalists/marshal.png:75"
            offset=0.2~0.0
        [/frame]
    [/attack_anim]
[/unit_type]
