#textdomain wesnoth-units
# 생성 파일: utils/samguk/gen_units.py가 data/core/units/dunefolk/Windbolt.cfg에서 만들었다.

#define PATH_TEMP
units/dunefolk/rider/#enddef

[unit_type]
    id=gog_windbolt
    name= _ "질풍궁기"
    race=goguryeo
    image="{PATH_TEMP}windbolt.png"
    hitpoints=52
    movement_type=dunehorse
    movement=8
    experience=150
    level=3
    alignment=liminal
    advances_to=null
    {AMLA_DEFAULT}
    cost=49
    usage=archer
    undead_variation=mounted
    description= _ "바람처럼 나타나 화살 비를 퍼붓고 사라지는 기마궁수의 정예다."
    die_sound=horse-die.ogg
    {DEFENSE_ANIM "{PATH_TEMP}windbolt.png" "{PATH_TEMP}windbolt.png" {SOUND_LIST:HORSE_HIT} }

    [resistance]
        blade=90
    [/resistance]

    [attack]
        name=mace
        description= _ "mace"
        type=impact
        range=melee
        damage=10
        number=2
        icon=attacks/mace.png
    [/attack]
    [attack]
        name=composite bow
        description= _ "composite bow"
        type=pierce
        range=ranged
        damage=8
        number=5
        icon=attacks/bow-short-reinforced.png
    [/attack]

    [attack_anim]
        [filter_attack]
            name=mace
        [/filter_attack]
        start_time=-250
        horse_sound_start_time=-250
        [frame]
            image="{PATH_TEMP}windbolt.png:400"
        [/frame]
        [horse_sound_frame]
            sound=horse-canter.wav
        [/horse_sound_frame]
        {SOUND:HIT_AND_MISS mace.ogg mace-miss.ogg -100}
    [/attack_anim]
    [attack_anim]
        [filter_attack]
            name=composite bow
        [/filter_attack]
        start_time=-250
        missile_start_time=-150
        [missile_frame]
            duration=150
            image="projectiles/missile-n.png"
            image_diagonal="projectiles/missile-ne.png"
        [/missile_frame]
        [frame]
            image="{PATH_TEMP}windbolt.png:300"
        [/frame]
        {SOUND:HIT_AND_MISS bow-puny.ogg bow-puny-miss.ogg -225}
    [/attack_anim]
[/unit_type]

#undef PATH_TEMP
